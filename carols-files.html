<!--  CAROL'S FILES  -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Carol's Files</title>

<style>
  :root{
    --paper:#F5EFE8; --paper-soft:#FCFAF7; --blush:#EBD3D7; --petal:#E9C2C9;
    --rose:#C9A2AC; --rose-deep:#B98792; --ink:#4A3F44; --ink-soft:#6E6068; --line:#E4D6D2;
    --metal-1:#cfcfcf; --metal-2:#9a9a9a; --metal-3:#7c7c7c;
    --shadow:0 18px 40px -22px rgba(74,63,68,.45);
    --display:"Didot","Hoefler Text","Palatino Linotype",Georgia,serif;
    --serif:"Palatino","Palatino Linotype",Georgia,"Times New Roman",serif;
    --script:"Snell Roundhand","Brush Script MT","Apple Chancery",cursive;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{ font-family:var(--ui); color:var(--ink); background:#fff; overflow:hidden; -webkit-font-smoothing:antialiased; }

  .screen{ position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  .topbar{ display:flex; align-items:center; gap:14px; padding:max(18px,env(safe-area-inset-top)) 26px 14px; min-height:60px; }
  .back{ border:none; background:var(--paper-soft); color:var(--ink); width:42px; height:42px; border-radius:50%;
    font-size:20px; cursor:pointer; box-shadow:var(--shadow); display:grid; place-items:center; transition:transform .15s; }
  .back:active{ transform:scale(.92); }
  .crumb{ font-family:var(--display); font-size:22px; }
  .topbar .spacer{ flex:1; }
  .date-pill{ font-family:var(--serif); font-size:14px; color:var(--ink-soft); font-style:italic; }

  #home{ background:#fff; }
  .home-head{ text-align:center; padding:42px 24px 6px; }
  .home-head .hi{ font-family:var(--script); font-size:54px; line-height:1; color:var(--rose-deep); }
  .home-head .sub{ font-family:var(--serif); font-style:italic; color:var(--ink-soft); margin-top:8px; font-size:15px; }

  .desktop{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; display:grid; gap:30px 20px; align-content:start;
    justify-content:center; grid-template-columns:repeat(2,160px); padding:30px clamp(20px,5vw,80px) 70px; }
  .folder{ width:150px; cursor:pointer; text-align:center; background:none; border:none; padding:0; }
  .folder .ico{ position:relative; width:150px; height:112px; margin:0 auto; border-radius:12px 12px 14px 14px;
    box-shadow:var(--shadow); transition:transform .18s ease; background:var(--petal); overflow:hidden; }
  .folder:active .ico{ transform:translateY(2px) scale(.98); }
  .folder .ico::before{ content:""; position:absolute; top:-13px; left:14px; width:62px; height:18px; border-radius:10px 12px 0 0; background:inherit; z-index:0; }
  .folder .ico .sheen{ position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 42%); }
  .folder .label{ margin-top:12px; font-family:var(--serif); font-size:15px; color:var(--ink); }

  .nb-page{ flex:1; background:var(--paper-soft); border-radius:18px; margin:6px 16px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .rings{ height:30px; position:relative; flex-shrink:0; background:linear-gradient(180deg,#fff,#f3ece6); border-bottom:1px solid var(--line); }
  .rings i{ position:absolute; top:8px; width:16px; height:16px; border-radius:50%; border:3px solid #b9b0ab; background:radial-gradient(circle at 35% 30%,#fff,#cfc8c3); }
  .page-body{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:22px clamp(16px,3vw,34px) 96px; }

  .notebook{ flex:1; display:flex; min-height:0; }
  .nb-tabs{ width:128px; padding:14px 0 22px 10px; display:flex; flex-direction:column; gap:10px; flex-shrink:0; }
  .nb-tab{ border:none; cursor:pointer; text-align:left; font-family:var(--serif); font-size:15px; background:var(--blush); color:var(--ink);
    padding:14px 12px; border-radius:14px 0 0 14px; margin-right:-2px; box-shadow:-6px 6px 14px -10px rgba(74,63,68,.5); transition:.18s; opacity:.7; }
  .nb-tab.on{ background:var(--paper-soft); opacity:1; transform:translateX(2px); font-weight:600; }
  .notebook .nb-page{ margin:14px 16px 18px 0; }

  .page-head{ display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .page-head h2{ font-family:var(--display); font-weight:400; font-size:30px; margin:0; }
  .page-head .hint{ font-family:var(--serif); font-style:italic; color:var(--ink-soft); font-size:14px; }
  .page-head .grow{ flex:1; }

  .btn{ border:none; cursor:pointer; font-family:var(--ui); font-size:14px; padding:10px 16px; border-radius:999px; background:var(--paper-soft); color:var(--ink); box-shadow:var(--shadow); transition:.15s; }
  .btn:active{ transform:scale(.95); }
  .btn.rose{ background:var(--rose); color:#fff; } .btn.ghost{ background:transparent; box-shadow:none; color:var(--ink-soft); } .btn.sm{ padding:7px 12px; font-size:13px; }
  .muted{ color:var(--ink-soft); font-family:var(--serif); font-style:italic; }
  input[type=file]{ display:none; }

  .seg{ display:inline-flex; background:var(--blush); border-radius:999px; padding:3px; gap:2px; }
  .seg button{ border:none; background:transparent; padding:7px 14px; border-radius:999px; cursor:pointer; font-family:var(--ui); font-size:13px; color:var(--ink); }
  .seg button.on{ background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.12); font-weight:600; }

  .cards{ display:flex; flex-wrap:wrap; gap:26px; align-items:flex-start; }
  .pcard{ width:236px; background:#fff; border-radius:4px; padding:16px 16px 40px; position:relative; box-shadow:0 14px 30px -16px rgba(74,63,68,.55); transform:rotate(var(--rot,-1.4deg)); }
  .pcard .staple{ position:absolute; top:-7px; left:50%; transform:translateX(-50%) rotate(-1deg); width:50px; height:13px; border-radius:3px;
    background:linear-gradient(180deg,var(--metal-1),var(--metal-2) 55%,var(--metal-3)); box-shadow:0 2px 3px rgba(0,0,0,.35); }
  .pcard .staple::before,.pcard .staple::after{ content:""; position:absolute; bottom:-5px; width:5px; height:7px; background:linear-gradient(180deg,var(--metal-2),var(--metal-3)); border-radius:0 0 2px 2px; }
  .pcard .staple::before{ left:4px; } .pcard .staple::after{ right:4px; }
  .pcard .face{ border:1px solid #efe7e2; border-radius:2px; background:#fdfbf9; display:flex; }
  .pcard textarea.aff{ flex:1; border:none; resize:none; background:transparent; padding:16px; outline:none; font-family:var(--serif); font-size:18px; line-height:1.5; color:var(--ink); }
  .pcard .cap{ position:absolute; bottom:12px; left:0; right:0; text-align:center; font-family:var(--script); font-size:18px; color:var(--rose-deep); pointer-events:none; }
  .pcard .del{ position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%; border:none; background:rgba(255,255,255,.92); color:var(--ink-soft); cursor:pointer; font-size:14px; z-index:6; box-shadow:0 2px 6px rgba(0,0,0,.16); }
  .pcard .resize-h{ position:absolute; right:2px; bottom:2px; width:22px; height:22px; cursor:nwse-resize; z-index:6; background:radial-gradient(circle at 70% 70%,var(--rose) 30%,transparent 32%); touch-action:none; }

  .draw-wrap{ position:relative; width:100%; }
  .draw-wrap canvas{ display:block; width:100%; touch-action:none; border-radius:2px; background:#fdfbf9; }
  .draw-tools{ display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .swatch{ width:22px; height:22px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; }
  .swatch.on{ box-shadow:0 0 0 2px var(--rose-deep); }

  .board-toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .board{ position:relative; flex:1; min-height:520px; border-radius:14px; border:1px dashed var(--line); overflow:hidden;
    background:linear-gradient(0deg,rgba(201,162,172,.06),rgba(201,162,172,.06)),var(--paper-soft); touch-action:none; }
  .board .empty{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-family:var(--serif); font-style:italic; color:var(--ink-soft); pointer-events:none; padding:30px; }
  .board canvas.layer{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }

<script>
/* ===== STORAGE (nunca trava a interface) ===== */
const mem={}; let storageBad=false;
const hasStore=()=>{ try{ return !!window.storage; }catch(e){ return false; } };
const withTimeout=(p,ms=800)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
const Store={
  async get(k){ if(k in mem) return mem[k]; if(storageBad||!hasStore()) return null;
    try{ const r=await withTimeout(window.storage.get(k)); const v=(r&&r.value!=null)?JSON.parse(r.value):null; if(v!=null) mem[k]=v; return v; }
    catch(e){ if(e&&e.message==='timeout') storageBad=true; return null; } },
  async set(k,v){ mem[k]=v; if(storageBad||!hasStore()) return; try{ await withTimeout(window.storage.set(k,JSON.stringify(v))); }catch(e){ if(e&&e.message==='timeout') storageBad=true; } },
  async del(k){ delete mem[k]; if(storageBad||!hasStore()) return; try{ await withTimeout(window.storage.delete(k)); }catch(e){ if(e&&e.message==='timeout') storageBad=true; } }
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const debounce=(fn,ms=500)=>{ let t; return(...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };
const fmtDate=d=>d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const todayKey=()=>new Date().toISOString().slice(0,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const el=h=>{ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const INKS=['#4A3F44','#B98792','#1f1f1f'];

/* ===== DIÁLOGOS PRÓPRIOS (funcionam no iPad) ===== */
function openModal(title,contentNode){
  const bg=el('<div class="modal-bg"></div>'); const m=el('<div class="modal"></div>');
  if(title) m.appendChild(el(`<h3>${title}</h3>`)); m.appendChild(contentNode); bg.appendChild(m); document.body.appendChild(bg);
  bg.addEventListener('pointerdown',e=>{ if(e.target===bg) close(); });
  function close(){ bg.remove(); } return { close };
}
function confirmModal(msg,yes='Apagar'){
  return new Promise(res=>{
    const body=el(`<div><p style="font-family:var(--serif);font-size:16px;color:var(--ink);margin:0 0 18px;line-height:1.5">${msg}</p>
      <div class="actions"><button class="btn ghost" id="cNo">Cancelar</button><button class="btn rose" id="cYes">${yes}</button></div></div>`);
    const mod=openModal('',body);
    body.querySelector('#cNo').onclick=()=>{ mod.close(); res(false); };
    body.querySelector('#cYes').onclick=()=>{ mod.close(); res(true); };
  });
}
function toast(msg){ const t=el(`<div class="toast">${msg}</div>`); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ===== DESENHO (Apple Pencil + toque) ===== */
function makeDrawSurface(host,opts){
  const o=Object.assign({height:220,save:true,toolbar:true},opts);
  const wrap=el('<div class="draw-wrap"></div>'); const canvas=document.createElement('canvas'); wrap.appendChild(canvas); host.appendChild(wrap);
  const ctx=canvas.getContext('2d'); const ratio=Math.min(window.devicePixelRatio||1,2);
  const state={tool:'pen',color:INKS[0],penOnly:false}; let saved=null, curH=o.height;
  if(o.toolbar){
    const tools=el('<div class="draw-tools"></div>'); host.appendChild(tools);
    INKS.forEach((c,i)=>{ const s=el('<div class="swatch'+(i===0?' on':'')+'"></div>'); s.style.background=c;
      s.onclick=()=>{ state.tool='pen'; state.color=c; [...tools.querySelectorAll('.swatch')].forEach(x=>x.classList.remove('on')); s.classList.add('on'); er.classList.remove('rose'); }; tools.appendChild(s); });
    const er=mk('Borracha',()=>{ state.tool=state.tool==='eraser'?'pen':'eraser'; er.classList.toggle('rose',state.tool==='eraser'); });
    const cl=mk('Limpar',()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); persist(); });
    const po=mk('Só Pencil',()=>{ state.penOnly=!state.penOnly; po.classList.toggle('rose',state.penOnly); });
    tools.append(er,cl,po);
    function mk(t,fn){ const b=el('<button class="btn sm"></button>'); b.textContent=t; b.onclick=fn; return b; }
  }
  function drawSaved(){ if(!saved) return; const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.width/ratio,curH); img.src=saved; }
  function size(){ const w=wrap.clientWidth||220; canvas.style.height=curH+'px'; canvas.width=Math.round(w*ratio); canvas.height=Math.round(curH*ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; drawSaved(); }
  const persist=debounce(async()=>{ saved=canvas.toDataURL('image/png'); if(o.save) await Store.set(o.key,saved); },700);
  let drawing=false,last=null; const P=e=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||0.5}; };
  canvas.addEventListener('pointerdown',e=>{ if(state.penOnly&&e.pointerType==='touch')return; drawing=true; last=P(e); canvas.setPointerCapture?.(e.pointerId); e.preventDefault(); });
  canvas.addEventListener('pointermove',e=>{ if(!drawing)return; if(state.penOnly&&e.pointerType==='touch')return; const q=P(e);
    ctx.globalCompositeOperation=state.tool==='eraser'?'destination-out':'source-over'; ctx.strokeStyle=state.color; ctx.lineWidth=(state.tool==='eraser'?16:2.4)*(0.4+q.p*1.4);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(q.x,q.y); ctx.stroke(); last=q; e.preventDefault(); });
  const up=()=>{ if(drawing){ drawing=false; persist(); } }; window.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  (async()=>{ if(o.save) saved=await Store.get(o.key); size(); })(); window.addEventListener('resize',debounce(size,250));
  return { setHeight:h=>{ curH=h; size(); }, refit:size };
}

/* ===== ROTEADOR ===== */
const screens={ home:document.getElementById('home'), folder:document.getElementById('folder') };
function show(id){ Object.values(screens).forEach(s=>s.classList.remove('active')); screens[id].classList.add('active'); }
function goHome(){ stopTimerFab(); show('home'); }
document.getElementById('homeDate').textContent=fmtDate(new Date());
document.getElementById('folderDate').textContent=fmtDate(new Date());

/* ===== PASTAS (fixas — novas pastas a gente adiciona aqui) ===== */
const FOLDERS=[
  {id:'journals',   label:'Daily Journals', cover:'cv-croco', template:'journal'},
  {id:'exercicios', label:'Exercícios',     cover:'cv-poa',   template:'workouts'},
  {id:'leitura',    label:'Leitura',        cover:'cv-deer',  template:'reading'}
];
function renderDesktop(){
  const d=document.getElementById('desktop'); d.innerHTML='';
  FOLDERS.forEach(f=>{
    const inner = '';
    const b=el(`<button class="folder"><div class="ico ${f.cover}">${inner}<span class="sheen"></span></div><div class="label">${f.label}</div></button>`);
    b.onclick=()=>openFolder(f); d.appendChild(b);
  });
}
let FID=null, FOLDER=null;
function openFolder(f){
  FID=f.id; FOLDER=f; document.getElementById('folderTitle').textContent=f.label;
  if(f.template==='journal') openJournals();
  else if(f.template==='board') openBoardFolder();
  else if(f.template==='reading') openLeitura();
  else if(f.template==='workouts') openWorkouts();
  else openNotesFolder();
  show('folder');
}
const K=s=>`${FID}:${s}`;

/* ===== JOURNAL ===== */
const JTABS=[{id:'afirmacoes',label:'Afirmações',render:renderAfirmacoes},{id:'visualizacao',label:'Visualização',render:renderBoard},{id:'journaling',label:'Journaling',render:renderJournaling}];
let curTab='afirmacoes';
function openJournals(){
  curTab='afirmacoes';
  document.getElementById('folderContent').innerHTML=`<div class="notebook"><div class="nb-tabs" id="nbTabs"></div>
    <div class="nb-page"><div class="rings" id="rings"></div><div class="page-body" id="pageBody"></div>
      <button class="timer-fab" id="timerFab">⏱</button><div class="timer-panel" id="timerPanel"></div></div></div>`;
  buildRings(); buildTabs(); buildTimer(); selectTab('afirmacoes');
}
function buildRings(){ const r=document.getElementById('rings'); r.innerHTML=''; for(let i=0;i<8;i++){ const e=document.createElement('i'); e.style.left=(8+i*12.5)+'%'; r.appendChild(e); } }
function buildTabs(){ const t=document.getElementById('nbTabs'); t.innerHTML=''; JTABS.forEach(tab=>{ const b=el(`<button class="nb-tab${tab.id===curTab?' on':''}">${tab.label}</button>`); b.onclick=()=>selectTab(tab.id); b.dataset.id=tab.id; t.appendChild(b); }); }
function selectTab(id){ curTab=id; [...document.querySelectorAll('.nb-tab')].forEach(b=>b.classList.toggle('on',b.dataset.id===id)); JTABS.find(t=>t.id===id).render(document.getElementById('pageBody')); }

async function renderAfirmacoes(body){
  body.innerHTML='';
  const head=el(`<div class="page-head"><h2>Afirmações</h2><span class="hint">leia toda manhã — pense, acredite, realize</span><span class="grow"></span>
    <button class="btn" id="morningBtn">☀︎ Modo Manhã</button><button class="btn rose" id="addTxt">+ Texto</button><button class="btn" id="addHand">+ À mão</button></div>`);
  body.appendChild(head); const grid=el('<div class="cards" id="affCards"></div>'); body.appendChild(grid);
  head.querySelector('#addTxt').onclick=()=>addAff('text'); head.querySelector('#addHand').onclick=()=>addAff('draw'); head.querySelector('#morningBtn').onclick=openMorning;
  const ids=await Store.get(K('aff:index'))||[];
  if(!ids.length) grid.appendChild(el('<p class="muted">Crie sua primeira afirmação. Comece por um objetivo, um sonho ou algo que você escolhe acreditar hoje.</p>'));
  for(const id of ids){ const a=await Store.get(K('aff:'+id)); if(a) renderAffCard(grid,a); }
}
async function addAff(type){ const a={id:uid(),type,text:'',createdAt:Date.now(),w:236,h:200};
  await Store.set(K('aff:'+a.id),a); const ids=await Store.get(K('aff:index'))||[]; ids.push(a.id); await Store.set(K('aff:index'),ids);
  const grid=document.getElementById('affCards'); grid.querySelector('.muted')?.remove(); renderAffCard(grid,a); }
function renderAffCard(grid,a){
  const rot=(Math.random()*4-2).toFixed(1);
  const card=el(`<div class="pcard" style="--rot:${rot}deg; width:${a.w||236}px"><div class="staple"></div><button class="del">✕</button>
    <div class="face"></div><div class="cap">${new Date(a.createdAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</div><div class="resize-h"></div></div>`);
  const face=card.querySelector('.face'); let surf=null;
  if(a.type==='text'){ const ta=el(`<textarea class="aff" placeholder="escreva sua afirmação…">${a.text||''}</textarea>`); ta.style.minHeight=(a.h||200)+'px';
    ta.addEventListener('input',debounce(async()=>{ a.text=ta.value; await Store.set(K('aff:'+a.id),a); },400)); face.appendChild(ta); }
  else { face.style.display='block'; face.style.padding='0'; surf=makeDrawSurface(face,{key:K('affdraw:'+a.id),height:a.h||200}); }
  card.querySelector('.del').onclick=async()=>{ if(!(await confirmModal('Apagar esta afirmação?'))) return; await Store.del(K('aff:'+a.id)); await Store.del(K('affdraw:'+a.id));
    const ids=await Store.get(K('aff:index'))||[]; await Store.set(K('aff:index'),ids.filter(x=>x!==a.id)); card.remove(); };
  const h=card.querySelector('.resize-h'); let rs=false,sx,sy,sw,sh;
  h.addEventListener('pointerdown',e=>{ rs=true; h.setPointerCapture(e.pointerId); sx=e.clientX; sy=e.clientY; sw=card.offsetWidth; sh=(a.h||200); e.preventDefault(); e.stopPropagation(); });
  h.addEventListener('pointermove',e=>{ if(!rs)return; const w=clamp(sw+(e.clientX-sx),170,560), hh=clamp(sh+(e.clientY-sy),120,640); card.style.width=w+'px'; a.w=Math.round(w); a.h=Math.round(hh);
    if(a.type==='text'){ card.querySelector('textarea').style.minHeight=hh+'px'; } else if(surf){ surf.setHeight(hh); } });
  h.addEventListener('pointerup',async()=>{ if(rs){ rs=false; await Store.set(K('aff:'+a.id),a); } });
  grid.appendChild(card);
}

let mList=[],mIdx=0;
async function openMorning(){ const ids=await Store.get(K('aff:index'))||[]; mList=[];
  for(const id of ids){ const a=await Store.get(K('aff:'+id)); if(a&&a.type==='text'&&a.text.trim()) mList.push(a.text.trim()); }
  if(!mList.length){ toast('Adicione afirmações em texto para o Modo Manhã ☺'); return; }
  mIdx=0; renderMorning(); document.getElementById('morning').classList.add('open'); refreshReadBtn(); }
function renderMorning(){ document.getElementById('mAff').textContent=mList[mIdx]||'—'; document.getElementById('mCount').textContent=`${mIdx+1} / ${mList.length}`; }
function mNext(){ mIdx=(mIdx+1)%mList.length; renderMorning(); } function mPrev(){ mIdx=(mIdx-1+mList.length)%mList.length; renderMorning(); }
function closeMorning(){ document.getElementById('morning').classList.remove('open'); }
async function refreshReadBtn(){ const last=await Store.get(K('aff:lastRead')); const btn=document.getElementById('mDone');
  if(last===todayKey()){ const s=await Store.get(K('aff:streak'))||0; btn.textContent=`Lida hoje ✓ · ${s} dia(s) seguidos`; btn.classList.remove('rose'); }
  else { btn.textContent='Marcar como lida hoje'; btn.classList.add('rose'); } }
async function markRead(){ const last=await Store.get(K('aff:lastRead')); if(last===todayKey())return;
  let s=await Store.get(K('aff:streak'))||0; const y=new Date(Date.now()-864e5).toISOString().slice(0,10); s=(last===y)?s+1:1;
  await Store.set(K('aff:lastRead'),todayKey()); await Store.set(K('aff:streak'),s); refreshReadBtn(); }

/* ===== MURAL ===== */
let boardMode='move', zTop=10, zBottom=1;
async function renderBoard(body){
  body.innerHTML='';
  body.appendChild(el(`<div class="page-head"><h2>Visualização</h2><span class="hint">1 dedo arrasta · 2 dedos giram e redimensionam</span></div>`));
  const tb=el(`<div class="board-toolbar"><button class="btn rose" id="vAddPhoto">+ Foto</button><button class="btn" id="vAddText">+ Texto</button>
    <button class="btn" id="vDraw">✎ Desenhar</button><span class="hint" id="vMode">modo: mover</span><input type="file" id="vFile" accept="image/*"/></div>`);
  body.appendChild(tb);
  const board=el(`<div class="board" id="board"><div class="empty">Adicione fotos e palavras do que você quer atrair.<br>Toque numa foto pra selecionar; arraste pra posicionar.</div></div>`);
  body.appendChild(board);
  const mini=el('<div class="draw-tools" id="drawMini" style="display:none;margin-top:10px"></div>'); body.appendChild(mini);
  const layer=document.createElement('canvas'); layer.className='layer'; layer.style.pointerEvents='none'; board.appendChild(layer);
  const draw=setupBoardCanvas(layer);
  tb.querySelector('#vAddPhoto').onclick=()=>tb.querySelector('#vFile').click();
  tb.querySelector('#vFile').onchange=async e=>{ const f=e.target.files[0]; if(f) await addPhoto(f); e.target.value=''; };
  tb.querySelector('#vAddText').onclick=()=>addVText();
  tb.querySelector('#vDraw').onclick=ev=>{ boardMode=boardMode==='draw'?'move':'draw'; ev.target.classList.toggle('rose',boardMode==='draw');
    layer.style.pointerEvents=boardMode==='draw'?'auto':'none'; tb.querySelector('#vMode').textContent='modo: '+(boardMode==='draw'?'desenhar':'mover'); mini.style.display=boardMode==='draw'?'flex':'none'; };
  INKS.forEach((c,i)=>{ const s=el(`<div class="swatch${i===0?' on':''}"></div>`); s.style.background=c;
    s.onclick=()=>{ draw.set('pen',c); [...mini.querySelectorAll('.swatch')].forEach(x=>x.classList.remove('on')); s.classList.add('on'); erB.classList.remove('rose'); }; mini.appendChild(s); });
  const erB=mkb('Borracha',()=>{ erB.classList.toggle('rose',draw.toggleEraser()); });
  mini.append(erB, mkb('Limpar desenho',async()=>{ if(await confirmModal('Limpar o desenho do mural?','Limpar')) draw.clear(); }), mkb('Só Pencil',()=>{ draw.togglePenOnly(); }));
  function mkb(t,fn){ const b=el('<button class="btn sm"></button>'); b.textContent=t; b.onclick=fn; return b; }
  board.addEventListener('dragover',e=>e.preventDefault());
  board.addEventListener('drop',async e=>{ e.preventDefault(); const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/')); if(f) await addPhoto(f); });
  board.addEventListener('pointerdown',e=>{ if(e.target===board||e.target===layer){ document.querySelectorAll('.vobj.sel').forEach(n=>n.classList.remove('sel')); } });
  const ids=await Store.get(K('vision:index'))||[];
  for(const id of ids){ const o=await Store.get(K('vis:'+id)); if(o){ zTop=Math.max(zTop,o.z||1); placeVObj(o); } }
  if(ids.length) board.querySelector('.empty')?.remove();
}
function setupBoardCanvas(canvas){
  const ctx=canvas.getContext('2d'); const ratio=Math.min(window.devicePixelRatio||1,2); let st={tool:'pen',color:INKS[0],penOnly:false}, saved=null;
  function size(){ const r=canvas.getBoundingClientRect(); canvas.width=Math.round(r.width*ratio); canvas.height=Math.round(r.height*ratio); ctx.setTransform(ratio,0,0,ratio,0,0); ctx.lineCap='round'; ctx.lineJoin='round';
    if(saved){ const i=new Image(); i.onload=()=>ctx.drawImage(i,0,0,r.width,r.height); i.src=saved; } }
  const persist=debounce(async()=>{ saved=canvas.toDataURL('image/png'); await Store.set(K('vision:draw'),saved); },800);
  let dr=false,last=null; const P=e=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||0.5}; };
  canvas.addEventListener('pointerdown',e=>{ if(st.penOnly&&e.pointerType==='touch')return; dr=true; last=P(e); e.preventDefault(); });
  canvas.addEventListener('pointermove',e=>{ if(!dr)return; if(st.penOnly&&e.pointerType==='touch')return; const q=P(e);
    ctx.globalCompositeOperation=st.tool==='eraser'?'destination-out':'source-over'; ctx.strokeStyle=st.color; ctx.lineWidth=(st.tool==='eraser'?16:2.4)*(0.4+q.p*1.4);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(q.x,q.y); ctx.stroke(); last=q; e.preventDefault(); });
  window.addEventListener('pointerup',()=>{ if(dr){ dr=false; persist(); } });
  (async()=>{ saved=await Store.get(K('vision:draw')); size(); })(); window.addEventListener('resize',debounce(size,250));
  return { set:(t,c)=>{ st.tool=t; st.color=c; }, toggleEraser:()=>{ st.tool=st.tool==='eraser'?'pen':'eraser'; return st.tool==='eraser'; }, togglePenOnly:()=>{ st.penOnly=!st.penOnly; return st.penOnly; }, clear:()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); persist(); } };
}
async function addPhoto(file){ const src=await downscale(file,1100,0.82); const o={id:uid(),kind:'photo',src,caption:'',x:40+Math.random()*120,y:40+Math.random()*90,scale:1,rot:0,z:++zTop};
  await saveVObj(o); placeVObj(o); document.querySelector('#board .empty')?.remove(); }
async function addVText(){ const o={id:uid(),kind:'text',text:'',x:60+Math.random()*120,y:60+Math.random()*90,scale:1,rot:0,z:++zTop};
  await saveVObj(o); placeVObj(o); document.querySelector('#board .empty')?.remove(); }
async function saveVObj(o){ await Store.set(K('vis:'+o.id),o); const ids=await Store.get(K('vision:index'))||[]; if(!ids.includes(o.id)){ ids.push(o.id); await Store.set(K('vision:index'),ids); } }
const saveVObjDeb=debounce(saveVObj,400);
function placeVObj(o){
  const board=document.getElementById('board'); if(!board)return;
  o.scale=o.scale||1; o.rot=o.rot||0; o.z=o.z||1;
  const node=el('<div class="vobj"></div>'); const apply=()=>{ node.style.transform=`translate(${o.x}px,${o.y}px) rotate(${o.rot}deg) scale(${o.scale})`; node.style.zIndex=o.z; }; apply();
  const ctrls=el(`<div class="vctrls"><button class="front" title="À frente">▲</button><button class="bk" title="Pra trás">▼</button><button class="del" title="Apagar">✕</button></div>`);
  if(o.kind==='photo'){ node.classList.add('vphoto'); node.appendChild(el(`<img src="${o.src}"/>`));
    const cap=el(`<input class="pcap-in" placeholder="legenda" value="${o.caption||''}"/>`); cap.addEventListener('pointerdown',e=>e.stopPropagation());
    cap.addEventListener('input',()=>{ o.caption=cap.value; saveVObjDeb(o); }); node.appendChild(cap); }
  else { node.classList.add('vtext'); node.appendChild(el('<div class="grip">⠿</div>'));
    const ta=el(`<textarea placeholder="uma palavra, um sentimento…">${o.text||''}</textarea>`); ta.addEventListener('pointerdown',e=>e.stopPropagation());
    ta.addEventListener('input',()=>{ o.text=ta.value; saveVObjDeb(o); }); node.appendChild(ta); }
  node.appendChild(ctrls);
  ctrls.querySelector('.front').onclick=e=>{ e.stopPropagation(); o.z=++zTop; apply(); saveVObj(o); };
  ctrls.querySelector('.bk').onclick=e=>{ e.stopPropagation(); o.z=--zBottom; apply(); saveVObj(o); };
  ctrls.querySelector('.del').onclick=async e=>{ e.stopPropagation(); await Store.del(K('vis:'+o.id)); const ids=await Store.get(K('vision:index'))||[]; await Store.set(K('vision:index'),ids.filter(x=>x!==o.id)); node.remove(); };
  const pts=new Map(); let base=null;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y); const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  function startG(){ const a=[...pts.values()]; if(a.length===1) base={m:1,sx:a[0].x,sy:a[0].y,x:o.x,y:o.y};
    else if(a.length>=2) base={m:2,cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,d:dist(a[0],a[1]),g:ang(a[0],a[1]),x:o.x,y:o.y,s:o.scale,r:o.rot}; }
  function updG(){ const a=[...pts.values()];
    if(base.m===1&&a.length===1){ o.x=base.x+(a[0].x-base.sx); o.y=base.y+(a[0].y-base.sy); }
    else if(base.m===2&&a.length>=2){ const c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}; o.scale=clamp(base.s*(dist(a[0],a[1])/base.d),0.3,4); o.rot=base.r+(ang(a[0],a[1])-base.g); o.x=base.x+(c.x-base.cx); o.y=base.y+(c.y-base.cy); } apply(); }
  node.addEventListener('pointerdown',e=>{ if(boardMode!=='move')return; if(e.target.closest('.vctrls'))return; if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
    node.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); select(); startG(); e.preventDefault(); });
  node.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId))return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); updG(); e.preventDefault(); });
  const end=e=>{ if(pts.has(e.pointerId)){ pts.delete(e.pointerId); saveVObj(o); if(pts.size>0) startG(); } };
  node.addEventListener('pointerup',end); node.addEventListener('pointercancel',end);
  function select(){ document.querySelectorAll('.vobj.sel').forEach(n=>n.classList.remove('sel')); node.classList.add('sel'); }
  board.appendChild(node);
}
function downscale(file,max,q){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
  let {width:w,height:h}=img; if(w>max||h>max){ const s=Math.min(max/w,max/h); w=Math.round(w*s); h=Math.round(h*s); }
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',q)); }; img.src=r.result; }; r.readAsDataURL(file); }); }

function renderEntry(list,e,prepend){

  node.querySelector('.title').addEventListener('input',debounce(async ev=>{ e.title=ev.target.value; await Store.set(K('jrn:'+e.id),e); },400));
  const moods=node.querySelector('.moods'); MOODS.forEach(m=>{ const b=el(`<button${e.mood===m?' class="on"':''}>${m}</button>`);
    b.onclick=async()=>{ e.mood=(e.mood===m?null:m); [...moods.children].forEach(x=>x.classList.remove('on')); if(e.mood)b.classList.add('on'); await Store.set(K('jrn:'+e.id),e); }; moods.appendChild(b); });
  const content=node.querySelector('.content');
  function paint(){ content.innerHTML='';

      ta.addEventListener('input',debounce(async()=>{ e.text=ta.value; await Store.set(K('jrn:'+e.id),e); },400)); content.appendChild(ta); }
    else makeDrawSurface(content,{key:K('jrndraw:'+e.id),height:260}); }
  const seg=node.querySelector('.seg.mode'); const setSeg=()=>[...seg.children].forEach(b=>b.classList.toggle('on',b.dataset.m===e.mode));

  setSeg(); paint();
  node.querySelector('.del-e').onclick=async()=>{ if(!(await confirmModal('Apagar entrada?'))) return; await Store.del(K('jrn:'+e.id)); await Store.del(K('jrndraw:'+e.id));
    const ids=await Store.get(K('journal:index'))||[]; await Store.set(K('journal:index'),ids.filter(x=>x!==e.id)); node.remove(); };
  prepend?list.prepend(node):list.appendChild(node);

const WD=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const WCOLORS=['#C9A2AC','#B98792','#D9A9B3','#9DB6A6','#C9B07A','#A99BC0'];
function openWorkouts(){ document.getElementById('folderContent').innerHTML=`<div class="nb-page"><div class="page-body" id="pageBody"></div></div>`; renderWorkouts(document.getElementById('pageBody')); }
async function renderWorkouts(body){
  body.innerHTML='';
  const head=el(`<div class="page-head"><h2>${FOLDER.label}</h2><span class="hint">monte sua semana — toque num treino pra ver os detalhes</span><span class="grow"></span><button class="btn" id="mngW">Gerenciar treinos</button></div>`);
  body.appendChild(head); head.querySelector('#mngW').onclick=manageWorkouts;
  const week=el('<div class="week"></div>'); body.appendChild(week);
  const defs=await Store.get(K('wdefs'))||[]; const plan=await Store.get(K('wplan'))||{}; const defMap=Object.fromEntries(defs.map(d=>[d.id,d]));
  WD.forEach((d,i)=>{ const day=el(`<div class="day"><h4>${d}</h4><div class="chips"></div><button class="addw">+ treino</button></div>`); const chips=day.querySelector('.chips');
    (plan[i]||[]).forEach(wid=>{ const def=defMap[wid]; if(!def)return; const chip=el(`<button class="wchip" style="background:${def.color}">${def.name||'treino'}</button>`); chip.onclick=()=>workoutDetail(def,i); chips.appendChild(chip); });

async function pickWorkout(dayIdx){
  const defs=await Store.get(K('wdefs'))||[];

  const wrap=el('<div></div>'); defs.forEach(d=>{ const b=el(`<button class="wchip" style="background:${d.color};margin:0 8px 10px 0">${d.name||'treino'}</button>`);
    b.onclick=async()=>{ const plan=await Store.get(K('wplan'))||{}; plan[dayIdx]=plan[dayIdx]||[]; if(!plan[dayIdx].includes(d.id)) plan[dayIdx].push(d.id); await Store.set(K('wplan'),plan); mod.close(); renderWorkouts(document.getElementById('pageBody')); }; wrap.appendChild(b); });
  const mod=openModal('Adicionar treino em '+WD[dayIdx],wrap);
}

async function manageWorkouts(){

    r.querySelector('.ws').addEventListener('input',debounce(async e=>{ d.specs=e.target.value; await saveDef(d); },400));

      const plan=await Store.get(K('wplan'))||{}; Object.keys(plan).forEach(k=>plan[k]=plan[k].filter(x=>x!==d.id)); await Store.set(K('wplan'),plan); };

  defs.forEach(d=>wrap.appendChild(row(d)));
  const add=el('<button class="btn rose">+ Novo treino</button>'); const m=el('<div></div>'); m.appendChild(wrap); m.appendChild(add);
  const actions=el('<div class="actions"><button class="btn" id="wClose">Pronto</button></div>'); m.appendChild(actions);
  const mod=openModal('Meus treinos',m);
  add.onclick=async()=>{ const list=await Store.get(K('wdefs'))||[]; const d={id:uid(),name:'',color:WCOLORS[list.length%WCOLORS.length],specs:''}; list.push(d); await Store.set(K('wdefs'),list); wrap.appendChild(row(d)); };
  m.querySelector('#wClose').onclick=()=>{ mod.close(); renderWorkouts(document.getElementById('pageBody')); };
  async function saveDef(d){ const list=await Store.get(K('wdefs'))||[]; const i=list.findIndex(x=>x.id===d.id); if(i>=0) list[i]=d; else list.push(d); await Store.set(K('wdefs'),list); }
}

/* ===== TIMER ===== */
let tEl=0,tRun=false,tInt=null,tPr='Afirmações';
const PRACTICES=['Afirmações','Visualização','Journaling','Leitura','Exercícios'];
function buildTimer(){
  const panel=document.getElementById('timerPanel');
  panel.innerHTML=`<h3>Cronômetro</h3><select id="tPr">${PRACTICES.map(p=>`<option ${p===tPr?'selected':''}>${p}</option>`).join('')}</select>
    <div class="clock" id="tClock">00:00</div><div class="timer-row"><button class="btn" id="tStart">Iniciar</button><button class="btn" id="tReset">Zerar</button></div>
    <button class="btn rose" id="tSave" style="width:100%;margin-top:8px">Salvar sessão</button><div class="timer-log" id="tLog"></div>`;
  document.getElementById('timerFab').onclick=()=>panel.classList.toggle('open');
  document.getElementById('tPr').onchange=e=>tPr=e.target.value;
  document.getElementById('tStart').onclick=toggleTimer; document.getElementById('tReset').onclick=()=>{ tEl=0; renderClock(); };
  document.getElementById('tSave').onclick=saveSession; renderClock(); renderTimerLog();
}
function renderClock(){ const m=String(Math.floor(tEl/60)).padStart(2,'0'),s=String(tEl%60).padStart(2,'0'); const c=document.getElementById('tClock'); if(c)c.textContent=`${m}:${s}`; }
function toggleTimer(){ tRun=!tRun; const b=document.getElementById('tStart'),f=document.getElementById('timerFab');
  if(tRun){ b.textContent='Pausar'; f.classList.add('live'); tInt=setInterval(()=>{ tEl++; renderClock(); },1000); } else { b.textContent='Iniciar'; f.classList.remove('live'); clearInterval(tInt); } }
function stopTimerFab(){ tRun=false; clearInterval(tInt); }
async function saveSession(){ if(tEl<1)return; const log=await Store.get(K('timer:log'))||[]; log.unshift({practice:tPr,seconds:tEl,date:Date.now()}); await Store.set(K('timer:log'),log.slice(0,50)); if(tRun)toggleTimer(); tEl=0; renderClock(); renderTimerLog(); }
async function renderTimerLog(){ const log=await Store.get(K('timer:log'))||[]; const box=document.getElementById('tLog'); if(!box)return;
  if(!log.length){ box.innerHTML='<div class="ln"><span>Sem sessões ainda</span></div>'; return; }
  box.innerHTML=log.slice(0,8).map(l=>{ const m=Math.floor(l.seconds/60),s=l.seconds%60; return `<div class="ln"><span>${l.practice}</span><span>${m}m ${String(s).padStart(2,'0')}s</span></div>`; }).join(''); }

/* ===== INIT ===== */
renderDesktop();
</script>
